<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a0033" />
<title>GROCEREIS ░▒▓ neon boodschappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Audiowide&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink: #ff2bd6;
    --hotpink: #ff14a3;
    --cyan: #00ffff;
    --purple: #9d00ff;
    --deep: #1a0033;
    --night: #0a0020;
    --yellow: #fff95b;
    --orange: #ff8a3d;
    --line: rgba(0, 255, 255, 0.35);
  }
  html, body { min-height: 100%; }
  body {
    font-family: 'VT323', monospace;
    color: #f8e1ff;
    background: #0a0020;
    background-image:
      radial-gradient(ellipse at 50% 120%, rgba(255, 43, 214, 0.55), transparent 60%),
      radial-gradient(ellipse at 50% -20%, rgba(0, 255, 255, 0.25), transparent 60%),
      linear-gradient(180deg, #060014 0%, #1a0033 45%, #3a0066 75%, #ff14a3 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  /* synthwave grid floor */
  body::before {
    content: '';
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%) perspective(400px) rotateX(60deg);
    transform-origin: bottom center;
    width: 250vw;
    height: 60vh;
    background-image:
      linear-gradient(rgba(0, 255, 255, 0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 43, 214, 0.55) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
    mask-image: linear-gradient(to top, black 30%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 30%, transparent 100%);
    animation: gridmove 8s linear infinite;
  }
  @keyframes gridmove {
    from { background-position: 0 0, 0 0; }
    to { background-position: 0 60px, 60px 0; }
  }
  /* sun */
  body::after {
    content: '';
    position: fixed;
    left: 50%;
    top: 18%;
    transform: translateX(-50%);
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: linear-gradient(180deg, #fff95b 0%, #ff8a3d 45%, #ff14a3 85%, #9d00ff 100%);
    box-shadow: 0 0 90px rgba(255, 43, 214, 0.7), 0 0 180px rgba(157, 0, 255, 0.45);
    z-index: 0;
    pointer-events: none;
    opacity: 0.85;
    -webkit-mask-image: repeating-linear-gradient(180deg, black 0 12px, transparent 12px 18px, black 18px 32px, transparent 32px 40px, black 40px 64px, transparent 64px 76px, black 76px 100%);
    mask-image: repeating-linear-gradient(180deg, black 0 12px, transparent 12px 18px, black 18px 32px, transparent 32px 40px, black 40px 64px, transparent 64px 76px, black 76px 100%);
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 18px 120px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
    padding-top: 8px;
  }
  h1 {
    font-family: 'Audiowide', 'Press Start 2P', monospace;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 4px;
    color: #fff;
    text-shadow:
      0 0 6px #fff,
      0 0 14px var(--pink),
      0 0 28px var(--pink),
      0 0 60px var(--purple);
    margin-bottom: 4px;
  }
  h1 .alt { color: var(--cyan); text-shadow: 0 0 6px #fff, 0 0 14px var(--cyan), 0 0 28px var(--cyan); }
  .sub {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 3px;
    text-shadow: 0 0 6px var(--cyan);
  }

  .panel {
    background: linear-gradient(180deg, rgba(26, 0, 51, 0.85), rgba(10, 0, 32, 0.85));
    border: 2px solid var(--pink);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 18px;
    box-shadow:
      0 0 0 1px rgba(255, 43, 214, 0.4) inset,
      0 0 18px rgba(255, 43, 214, 0.35),
      0 0 60px rgba(157, 0, 255, 0.25);
    backdrop-filter: blur(2px);
  }
  .panel.cyan {
    border-color: var(--cyan);
    box-shadow:
      0 0 0 1px rgba(0, 255, 255, 0.4) inset,
      0 0 18px rgba(0, 255, 255, 0.35),
      0 0 60px rgba(0, 255, 255, 0.18);
  }
  .panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--yellow);
    text-shadow: 0 0 8px var(--orange), 0 0 16px var(--pink);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before { content: '▓▒░'; color: var(--pink); }
  .panel-title::after { content: '░▒▓'; color: var(--pink); margin-left: auto; }

  textarea {
    width: 100%;
    min-height: 130px;
    background: rgba(10, 0, 32, 0.75);
    border: 1.5px solid var(--cyan);
    border-radius: 4px;
    color: #f8e1ff;
    font-family: 'VT323', monospace;
    font-size: 20px;
    line-height: 1.25;
    padding: 10px 12px;
    resize: vertical;
    outline: none;
    box-shadow: 0 0 12px rgba(0, 255, 255, 0.25) inset;
  }
  textarea:focus {
    border-color: var(--pink);
    box-shadow: 0 0 12px rgba(255, 43, 214, 0.4) inset, 0 0 18px rgba(255, 43, 214, 0.4);
  }
  textarea::placeholder { color: rgba(0, 255, 255, 0.55); }

  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .btn {
    flex: 1 1 auto;
    appearance: none;
    border: 2px solid var(--cyan);
    background: linear-gradient(180deg, #ff14a3 0%, #9d00ff 100%);
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 12px 14px;
    border-radius: 4px;
    cursor: pointer;
    text-shadow: 0 0 6px rgba(0,0,0,0.5);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.15) inset,
      0 4px 0 #6a00b3,
      0 0 18px rgba(255, 43, 214, 0.55);
    transition: transform .05s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(2px); box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset, 0 2px 0 #6a00b3, 0 0 12px rgba(255, 43, 214, 0.45); }
  .btn.ghost {
    background: transparent;
    color: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px rgba(0,255,255,0.15) inset, 0 4px 0 rgba(0,255,255,0.25), 0 0 14px rgba(0,255,255,0.35);
    text-shadow: 0 0 8px var(--cyan);
  }
  .btn.danger {
    background: transparent;
    color: var(--yellow);
    border-color: var(--yellow);
    box-shadow: 0 0 0 1px rgba(255,249,91,0.2) inset, 0 4px 0 rgba(255,249,91,0.25), 0 0 14px rgba(255,138,61,0.5);
    text-shadow: 0 0 8px var(--orange);
  }
  .quick-add {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .quick-add input {
    flex: 1;
    background: rgba(10, 0, 32, 0.75);
    border: 1.5px solid var(--pink);
    border-radius: 4px;
    color: #f8e1ff;
    font-family: 'VT323', monospace;
    font-size: 20px;
    padding: 8px 12px;
    outline: none;
  }
  .quick-add input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
  }

  .stats {
    display: flex;
    gap: 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 2px;
    margin: 6px 0 14px;
    justify-content: center;
    text-shadow: 0 0 8px var(--cyan);
    flex-wrap: wrap;
  }
  .stats .stat b { color: var(--pink); text-shadow: 0 0 8px var(--pink); }

  .cat {
    margin-bottom: 14px;
  }
  .cat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 12px var(--cyan), 0 0 22px var(--cyan);
    padding: 8px 10px;
    border-left: 4px solid var(--cyan);
    background: linear-gradient(90deg, rgba(0,255,255,0.18), transparent);
    margin-bottom: 6px;
  }
  .cat.gekoeld .cat-head {
    color: #d9f6ff;
    border-left-color: #6cd7ff;
    background: linear-gradient(90deg, rgba(108, 215, 255, 0.22), transparent);
    text-shadow: 0 0 6px #fff, 0 0 12px #6cd7ff;
  }
  .cat.diepvries .cat-head {
    color: #e0f7ff;
    border-left-color: #b7f1ff;
    background: linear-gradient(90deg, rgba(183, 241, 255, 0.25), transparent);
    text-shadow: 0 0 6px #fff, 0 0 16px #b7f1ff;
  }
  .cat-head .ico { font-size: 18px; filter: drop-shadow(0 0 6px var(--pink)); }
  .cat-head .count { margin-left: auto; color: var(--pink); font-size: 10px; text-shadow: 0 0 6px var(--pink); }

  ul.items { list-style: none; }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(10, 0, 32, 0.65);
    border: 1px solid rgba(255, 43, 214, 0.45);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 22px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    user-select: none;
  }
  .item:hover { border-color: var(--pink); background: rgba(255, 43, 214, 0.08); }
  .item:active { transform: scale(0.99); }
  .gekoeld .item { border-color: rgba(108, 215, 255, 0.55); }
  .gekoeld .item:hover { border-color: #6cd7ff; background: rgba(108, 215, 255, 0.1); }
  .diepvries .item { border-color: rgba(183, 241, 255, 0.7); background: rgba(10, 30, 60, 0.7); }
  .diepvries .item:hover { border-color: #fff; background: rgba(183, 241, 255, 0.12); }

  .check {
    width: 22px; height: 22px;
    border: 2px solid var(--cyan);
    border-radius: 4px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.4);
    box-shadow: 0 0 6px rgba(0,255,255,0.5);
  }
  .item .label { flex: 1; line-height: 1; }
  .badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    padding: 4px 6px;
    border-radius: 3px;
    border: 1px solid;
    white-space: nowrap;
  }
  .badge.gekoeld { color: #6cd7ff; border-color: #6cd7ff; text-shadow: 0 0 6px #6cd7ff; background: rgba(108, 215, 255, 0.08); }
  .badge.diepvries { color: #b7f1ff; border-color: #b7f1ff; text-shadow: 0 0 6px #b7f1ff; background: rgba(183, 241, 255, 0.1); }
  .qty {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--yellow);
    text-shadow: 0 0 6px var(--orange);
    padding: 4px 6px;
    border: 1px dashed rgba(255, 249, 91, 0.6);
    border-radius: 3px;
  }
  .del {
    background: transparent;
    border: 1px solid rgba(255, 43, 214, 0.5);
    color: var(--pink);
    cursor: pointer;
    width: 26px; height: 26px;
    border-radius: 3px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    line-height: 1;
    text-shadow: 0 0 6px var(--pink);
  }
  .del:hover { background: rgba(255, 43, 214, 0.18); }

  /* done section */
  .done-section { margin-top: 26px; }
  .done-head {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--yellow);
    letter-spacing: 2px;
    text-shadow: 0 0 8px var(--orange), 0 0 16px var(--pink);
    padding: 10px 12px;
    border: 2px dashed var(--yellow);
    border-radius: 4px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .done-head::before { content: '◆◇◆'; color: var(--pink); }
  .done-head .count { margin-left: auto; color: var(--pink); font-size: 10px; }
  .done .item {
    opacity: 0.55;
    text-decoration: line-through;
    text-decoration-color: var(--pink);
    background: rgba(10, 0, 32, 0.45);
    border-color: rgba(255, 43, 214, 0.25);
  }
  .done .item .check {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-color: var(--pink);
    color: #fff;
    box-shadow: 0 0 10px var(--pink);
  }
  .done .item .check::after { content: '✓'; font-size: 14px; }

  .empty {
    text-align: center;
    color: rgba(248, 225, 255, 0.65);
    font-size: 18px;
    padding: 18px;
    border: 1px dashed rgba(0, 255, 255, 0.35);
    border-radius: 4px;
    margin-top: 8px;
  }

  footer {
    text-align: center;
    margin-top: 30px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(248, 225, 255, 0.55);
    text-shadow: 0 0 6px var(--pink);
  }

  /* scanline overlay */
  .scan {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 4px);
    pointer-events: none;
    z-index: 3;
    mix-blend-mode: overlay;
  }

  @media (max-width: 480px) {
    h1 { letter-spacing: 2px; }
    .panel-title { font-size: 9px; }
    .cat-head { font-size: 10px; }
    .item { font-size: 19px; }
    body::after { width: 220px; height: 220px; top: 14%; }
  }
</style>
</head>
<body>
<div class="scan"></div>
<div class="wrap">

  <header>
    <h1>GROCE<span class="alt">REIS</span></h1>
    <div class="sub">▒▓ neon boodschappenmodus ▓▒</div>
  </header>

  <section class="panel">
    <div class="panel-title">batch upload</div>
    <textarea id="batch" placeholder="Plak hier je lijstje, één item per regel...&#10;bv:&#10;2x melk&#10;tomaten&#10;diepvriespizza&#10;kipfilet&#10;banaan"></textarea>
    <div class="row">
      <button class="btn" id="addBatch">▶ verwerk lijst</button>
      <button class="btn ghost" id="clearBatch">wissen</button>
    </div>
    <div class="quick-add">
      <input id="quick" type="text" placeholder="of voeg snel één item toe..." />
      <button class="btn" id="addOne" style="flex:0 0 auto">+</button>
    </div>
  </section>

  <div class="stats">
    <div class="stat">nog te doen <b id="todoCount">0</b></div>
    <div class="stat">in mandje <b id="doneCount">0</b></div>
    <div class="stat">totaal <b id="totalCount">0</b></div>
  </div>

  <section id="todo"></section>

  <section class="done-section" id="doneSection" hidden>
    <div class="done-head">
      <span>in het mandje</span>
      <span class="count" id="doneHeadCount">0</span>
    </div>
    <div class="done" id="done"></div>
  </section>

  <div class="row" style="margin-top: 20px">
    <button class="btn ghost" id="uncheckAll">▲ alles terugzetten</button>
    <button class="btn danger" id="clearDone">▼ mandje leeg</button>
    <button class="btn danger" id="clearAll">✕ wis alles</button>
  </div>

  <footer>powered by neon &middot; ░▒▓ 2026 ▓▒░</footer>
</div>

<script>

/* check diepvries / gekoeld eerst (meest specifiek), dan ambient */
const MATCH_ORDER = ['diepvries','vleesvis','zuivel','fruit','brood','dranken','snoep','houdbaar','nonfood','overig'];

function normalize(s){
  return s.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9 &']/g,' ')
    .replace(/\s+/g,' ').trim();
}

function parseLine(line){
  let raw = line.trim();
  if(!raw) return null;
  // pak een aantal voorop: "2x melk", "3 appels", "2 stuks brood"
  let qty = '';
  const m = raw.match(/^(\d+\s*(?:x|stuks?|st\.?)?)\s+(.+)/i);
  if(m){ qty = m[1].replace(/\s+/g,'').toLowerCase(); raw = m[2].trim(); }
  return { name: raw, qty };
}

function categorize(name){
  const n = ' ' + normalize(name) + ' ';
  for(const id of MATCH_ORDER){
    const cat = CATEGORIES.find(c=>c.id===id);
    if(!cat || !cat.keywords.length) continue;
    for(const kw of cat.keywords){
      const k = ' ' + normalize(kw) + ' ';
      if(n.includes(k) || n.includes(' '+normalize(kw))){
        return cat.id;
      }
    }
  }
  return 'overig';
}

/* ------------------------- state ------------------------- */
const STORAGE_KEY = 'grocereis.v1';
let items = load();

function load(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}
function uid(){ return Math.random().toString(36).slice(2,10); }

function addItem(name, qty){
  if(!name) return;
  const catId = categorize(name);
  items.push({ id: uid(), name, qty: qty||'', cat: catId, done: false, ts: Date.now() });
}

/* --------------------- rendering --------------------- */
const $todo = document.getElementById('todo');
const $done = document.getElementById('done');
const $doneSection = document.getElementById('doneSection');

function render(){
  $todo.innerHTML = '';
  $done.innerHTML = '';

  const todo = items.filter(i=>!i.done);
  const done = items.filter(i=>i.done);

  // groepeer todo per categorie
  const byCat = {};
  for(const it of todo){
    (byCat[it.cat] = byCat[it.cat] || []).push(it);
  }

  const sortedCats = CATEGORIES
    .filter(c => byCat[c.id] && byCat[c.id].length)
    .sort((a,b)=>a.order-b.order);

  if(sortedCats.length === 0){
    $todo.innerHTML = '<div class="empty">geen openstaande boodschappen ▓▒░ tijd voor pizza</div>';
  }

  for(const cat of sortedCats){
    const list = byCat[cat.id];
    const tempClass = cat.temp; // ambient | gekoeld | diepvries
    const wrap = document.createElement('div');
    wrap.className = 'cat ' + tempClass;
    wrap.innerHTML = `
      <div class="cat-head">
        <span class="ico">${cat.icon}</span>
        <span>${cat.name.toUpperCase()}</span>
        ${cat.temp==='gekoeld' ? '<span class="badge gekoeld">GEKOELD</span>' : ''}
        ${cat.temp==='diepvries' ? '<span class="badge diepvries">DIEPVRIES</span>' : ''}
        <span class="count">${list.length}</span>
      </div>
      <ul class="items"></ul>`;
    const ul = wrap.querySelector('ul');
    for(const it of list){
      ul.appendChild(itemEl(it, cat));
    }
    $todo.appendChild(wrap);
  }

  // done lijst onderaan, ook geordend zelfde supermarkt-volgorde
  if(done.length){
    $doneSection.hidden = false;
    document.getElementById('doneHeadCount').textContent = done.length;
    const sortedDone = [...done].sort((a,b)=>{
      const oa = CATEGORIES.find(c=>c.id===a.cat).order;
      const ob = CATEGORIES.find(c=>c.id===b.cat).order;
      if(oa!==ob) return oa-ob;
      return a.ts-b.ts;
    });
    const ul = document.createElement('ul');
    ul.className = 'items';
    for(const it of sortedDone){
      const cat = CATEGORIES.find(c=>c.id===it.cat);
      ul.appendChild(itemEl(it, cat));
    }
    $done.appendChild(ul);
  } else {
    $doneSection.hidden = true;
  }

  document.getElementById('todoCount').textContent = todo.length;
  document.getElementById('doneCount').textContent = done.length;
  document.getElementById('totalCount').textContent = items.length;
}

function itemEl(it, cat){
  const li = document.createElement('li');
  li.className = 'item';
  li.dataset.id = it.id;
  const badges = [];
  if(cat.temp==='gekoeld') badges.push('<span class="badge gekoeld">GEKOELD</span>');
  if(cat.temp==='diepvries') badges.push('<span class="badge diepvries">DIEPVRIES</span>');
  li.innerHTML = `
    <span class="check"></span>
    ${it.qty ? `<span class="qty">${escapeHtml(it.qty)}</span>` : ''}
    <span class="label">${escapeHtml(it.name)}</span>
    ${badges.join(' ')}
    <button class="del" title="verwijder">✕</button>
  `;
  li.addEventListener('click', (e)=>{
    if(e.target.classList.contains('del')) return;
    toggle(it.id);
  });
  li.querySelector('.del').addEventListener('click', (e)=>{
    e.stopPropagation();
    remove(it.id);
  });
  return li;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggle(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  it.done = !it.done;
  it.ts = Date.now();
  save(); render();
}
function remove(id){
  items = items.filter(i=>i.id!==id);
  save(); render();
}

/* --------------------- events --------------------- */
document.getElementById('addBatch').addEventListener('click', ()=>{
  const txt = document.getElementById('batch').value;
  const lines = txt.split(/[\n,;]+/).map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    const parsed = parseLine(line);
    if(parsed) addItem(parsed.name, parsed.qty);
  }
  document.getElementById('batch').value = '';
  save(); render();
});

document.getElementById('clearBatch').addEventListener('click', ()=>{
  document.getElementById('batch').value = '';
});

document.getElementById('addOne').addEventListener('click', addOne);
document.getElementById('quick').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){ e.preventDefault(); addOne(); }
});
function addOne(){
  const inp = document.getElementById('quick');
  const v = inp.value.trim();
  if(!v) return;
  const p = parseLine(v);
  if(p) addItem(p.name, p.qty);
  inp.value = '';
  save(); render();
  inp.focus();
}

document.getElementById('uncheckAll').addEventListener('click', ()=>{
  items.forEach(i=>i.done=false);
  save(); render();
});
document.getElementById('clearDone').addEventListener('click', ()=>{
  if(!items.some(i=>i.done)) return;
  if(confirm('Alle afgevinkte items verwijderen?')){
    items = items.filter(i=>!i.done);
    save(); render();
  }
});
document.getElementById('clearAll').addEventListener('click', ()=>{
  if(!items.length) return;
  if(confirm('Hele lijst wissen?')){
    items = [];
    save(); render();
  }
});

render();
</script>
</body>
</html>
